name: check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest supported version; it is only built for older runner images.
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.x"
          - os: macos-latest
            python: "3.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/leak_scan.py
